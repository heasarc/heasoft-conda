
# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  name: xstar-data
  version: 6.37.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}
source:
  #url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/source/${{ name }}-${{ version }}.tar.gz
  url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/.staging/source/${{ name }}-${{ version }}.tar.gz
  sha256: e2d8266447a21da75c92aa499b67d27170582d26d8e50f39bd6170abc51a4252
build:
  number: 0
  noarch: generic
  script:
    content: |
      HEA_SUBDIR=heasoft
      mkdir -p $PREFIX/$HEA_SUBDIR/refdata
      mv ftools/xstar/data/* $PREFIX/$HEA_SUBDIR/refdata/

about:
  homepage: https://heasarc.gsfc.nasa.gov/docs/software/xstar/xstar.html
  summary: Main xstar data
  description: |
    Main xstar data
  documentation: https://heasarc.gsfc.nasa.gov/docs/software/xstar/xstar.html
