# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  name: heasoft
  version: 6.36
  gnu_version: 16.1.0
  clang_version: 22.1.8

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/source/${{ name }}-${{ version }}.tar.gz
  sha256: 53d91083195ddad7f19260ba6dbeebc01d96802f7e0e7db9d17e950eb4e7b4f9
  patches:
    - tcltk_Makefile.patch
    - pgplot_makefiles.patch
    - xspec.patch
    - zlib_makefiles.patch
    - python_makefiles.patch
    - itk_configure.patch
    - iwidgets_configure.patch
    - tix_configure.patch
    - if: osx
      then:
      - configures.patch
    - fix-x11-conda.patch

build:
  number: 1

requirements:
  host:
    - ${{ compiler('fortran') }} = ${{ gnu_version }}
    - if: osx
      then:
      - ${{ compiler('cxx') }} = ${{ clang_version }}
      - ${{ compiler('c') }} = ${{ clang_version }}
    - if: linux
      then:
      - ${{ compiler('cxx') }} = ${{ gnu_version }}
      - ${{ compiler('c') }} = ${{ gnu_version }}
    - make
    - pkg-config
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-xorgproto
    - xorg-libxcursor
    - fftw
    - fgsl
    - gsl
    - perl
    - pip
    - setuptools
    - numpy
    - scipy
    - astropy-base
    - matplotlib
    - if: linux
      then:
        - kernel-headers_linux-64 = 3.10.0
  run:
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-libxcursor
    - xorg-xorgproto
    - fftw
    - fgsl
    - gsl
    - perl
    - numpy
    - scipy
    - astropy-base
    - matplotlib
    - if: linux or (osx and not arm64)
      then:
        - lynx

about:
  homepage: https://heasarc.gsfc.nasa.gov/docs/software/lheasoft/
  #license_file: LICENSE
  summary: the core library of heasoft
  description: |
    xspec.
  documentation: https://heasarc.gsfc.nasa.gov/docs/software/lheasoft/
