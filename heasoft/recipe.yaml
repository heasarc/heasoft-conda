# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  name: heasoft
  version: 6.37

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/source/${{ name }}-${{ version }}.tar.gz
  sha256: b4f54a864ed541d18810d4b9fceb7a4550f0bdd632e25af543d89cb52b1b790e
  #path: /local/data/karpuz1/birby/conda/heasoft
  patches:
    - tcltk_Makefile.patch
    - pgplot_makefiles.patch
    - zlib_makefiles.patch
    - python_makefiles.patch
    - itk_configure.patch
    - if: osx
      then:
      - pgplot_makefiles_osx.patch
    - if: linux
      then:
      - xpa.patch
      - mktclapp.patch
      - fv_makefile.patch
      - fv_unix.patch
    - perl_config.patch
    - fix-x11-conda.patch

build:
  number: 0

requirements:
  host:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - pkg-config
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-xorgproto
    - xorg-libxcursor
    - fftw
    - gsl
    - if: osx or (linux and not aarch64)
      then:
        - fgsl
    - perl
    - pip
    - hatchling
    - numpy
    - scipy
    - astropy-base
    - matplotlib
    - if: linux and not aarch64
      then:
        - kernel-headers_linux-64 = 3.10.0
    - if: linux and aarch64
      then:
        - kernel-headers_linux-aarch64 = 4.18.0
  run:
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-libxcursor
    - xorg-xorgproto
    - fftw
    - gsl
    - if: osx or (linux and not aarch64)
      then:
        - fgsl
    - perl
    - fviewer
    - numpy
    - scipy
    - astropy-base
    - matplotlib
    - astro-gdt
    - requests
    - reproject
    - if: (linux and not aarch64) or (osx and not arm64)
      then:
        - lynx
        - mkl
  run_constraints:
    - xspec-data >=6.37

about:
  homepage: https://heasarc.gsfc.nasa.gov/docs/software/lheasoft/
  #license_file: LICENSE
  summary: HEASoft - High Energy Astrophysics Software
  description: |
    HEASoft is HEASARC's software suite that encompasses both new and legacy mission-independent or multi-mission FTOOLS, x-ray analysis tools (XSPEC, XRONOS, and XIMAGE), XSTAR, and numerous mission-specific packages.
  documentation: https://heasarc.gsfc.nasa.gov/docs/software/lheasoft/
