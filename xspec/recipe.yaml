# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  name: xspec
  version: 12.15.1
  hea_version: 6.36
  gnu_version: 16.1.0
  clang_version: 21.1.6
  perl_version: 5.32

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/source/heasoft-${{ hea_version }}.tar.gz
  sha256: 53d91083195ddad7f19260ba6dbeebc01d96802f7e0e7db9d17e950eb4e7b4f9
  patches:
    - ../heasoft/tcltk_Makefile.patch
    - ../heasoft/pgplot_makefiles.patch
    - ../heasoft/xspec.patch
    - ../heasoft/zlib_makefiles.patch
    - ../heasoft/python_makefiles.patch
    - ../heasoft/itk_configure.patch
    - ../heasoft/iwidgets_configure.patch
    - ../heasoft/tix_configure.patch
    - if: osx
      then:
      - ../heasoft/pgplot_makefiles_osx.patch
      - ../heasoft/configures.patch
    - ../heasoft/perl_config.patch
    - ../heasoft/fix-x11-conda.patch

build:
  number: 3

requirements:
  host:
    - ${{ compiler('fortran') }} = ${{ gnu_version }}
    - if: osx
      then:
      - ${{ compiler('cxx') }} = ${{ clang_version }}
      - ${{ compiler('c') }} = ${{ clang_version }}
    - if: linux
      then:
      - ${{ compiler('cxx') }} = ${{ gnu_version }}
      - ${{ compiler('c') }} = ${{ gnu_version }}
    - make
    - perl = ${{ perl_version }}
    - python
    - pkg-config
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-xorgproto
    - xorg-libxcursor
    - fftw
    - gsl
    - fgsl
    - numpy
    - if: linux
      then:
        - kernel-headers_linux-64 = 3.10.0
  run:
    - perl = ${{ perl_version }}
    - python
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-libxcursor
    - xorg-xorgproto
    - fftw
    - gsl
    - fgsl
    - numpy


about:
  homepage: https://heasarc.gsfc.nasa.gov/docs/software/xspec/index.html
  #license_file: LICENSE
  summary: Xspec - An X-Ray Spectral Fitting Package
  description: |
    XSPEC is a command-driven, interactive, X-ray spectral-fitting program, designed to be completely detector-independent so that it can be used for any spectrometer.
  documentation: https://heasarc.gsfc.nasa.gov/docs/software/xspec/index.html
