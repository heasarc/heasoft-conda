# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  name: xspec
  version: 13.0.0
  hea_version: 6.37.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/.staging/source/heasoft-${{ hea_version }}.tar.gz
  #url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/.staging/source/${{ name }}-${{ version }}.tar.gz
  sha256: b81a8f4659623bfebe20fe319e65b458017b7459ccab69bf80b9075d55a62b80
  #path: /local/data/karpuz1/birby/clean
  patches:
    - ../heasoft/tcltk_Makefile.patch
    - ../heasoft/pgplot_makefiles.patch
    - ../heasoft/zlib_makefiles.patch
    - ../heasoft/python_makefiles.patch
    - ../heasoft/itk_configure.patch
    - if: osx
      then:
      - ../heasoft/pgplot_makefiles_osx.patch
    - ../heasoft/perl_config.patch
    - ../heasoft/fix-x11-conda.patch

build:
  number: 0

requirements:
  host:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - python
    - pkg-config
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-xorgproto
    - xorg-libxcursor
    - numpy
    - fftw
    - gsl
    - pytorch * *cpu*
    - if: osx or (linux and not aarch64)
      then:
        - fgsl
  run:
    - python
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-libxcursor
    - xorg-xorgproto
    - numpy
    - fftw
    - gsl
    - pytorch * *cpu*
    - if: osx or (linux and not aarch64)
      then:
        - fgsl
    - if: (linux and not aarch64) or (osx and not arm64)
      then:
        - mkl
  run_constraints:
    - xspec-data >=6.37


about:
  homepage: https://heasarc.gsfc.nasa.gov/docs/software/xspec/index.html
  #license_file: LICENSE
  summary: Xspec - An X-Ray Spectral Fitting Package
  description: |
    XSPEC is a command-driven, interactive, X-ray spectral-fitting program, designed to be completely detector-independent so that it can be used for any spectrometer.
  documentation: https://heasarc.gsfc.nasa.gov/docs/software/xspec/index.html
