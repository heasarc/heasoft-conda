# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  name: fv
  version: 5.5.4
  hea_version: 6.37.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/source/${{ name }}-${{ hea_version }}.tar.gz
  #url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/.staging/source/${{ name }}-${{ hea_version }}.tar.gz
  sha256: 0b247a0f4710c882e32c6b6088ba51c07102eb916f1172855a425d3a879c1ca9
  #path: /local/data/karpuz1/birby/conda/heasoft
  patches:
    - ../heasoft/tcltk_Makefile.patch
    - ../heasoft/itk_configure.patch
    - if: linux
      then:
      - ../heasoft/xpa.patch
      - ../heasoft/mktclapp.patch
      - ../heasoft/fv_makefile.patch
      - ../heasoft/fv_unix.patch
    - ../heasoft/fix-x11-conda.patch
    - zlib_makefiles_fv.patch

build:
  number: 0

requirements:
  host:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - pkg-config
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-xorgproto
    - xorg-libxcursor
    - pip
    - hatchling
    - if: linux and not aarch64
      then:
        - kernel-headers_linux-64 = 3.10.0
    - if: linux and aarch64
      then:
        - kernel-headers_linux-aarch64 = 4.18.0
  run:
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-libxcursor
    - xorg-xorgproto
    # fftw
    # gsl
    # if: osx or (linux and not aarch64)
    # then:
    #   - fgsl
    # perl
    # numpy
    # scipy
    # astropy-base
    # matplotlib
    - if: (linux and not aarch64) or (osx and not arm64)
      then:
        - lynx
    # cfitsio
    # wcslib
    # tcltk:
    #  tcl/tk
    #  itcl/itk
    #  iwidgets
    #  tix
    #  xpa
    #  pow

about:
  homepage: https://heasarc.gsfc.nasa.gov/docs/software/lheasoft/
  #license_file: LICENSE
  summary: HEASoft - High Energy Astrophysics Software
  description: HEASoft is HEASARC's software suite that encompasses both new and legacy mission-independent or multi-mission FTOOLS, x-ray analysis tools (XSPEC, XRONOS, and XIMAGE), XSTAR, and numerous mission-specific packages.
  documentation: https://heasarc.gsfc.nasa.gov/docs/software/lheasoft/
