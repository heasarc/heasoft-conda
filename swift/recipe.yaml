# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  name: swift
  version: 6.37

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://heasarc.gsfc.nasa.gov/FTP/software/conda/.testing/source/${{ name }}-${{ version }}.tar.gz
  sha256: 9c9ce8a59ba8939ae11cd5b9f0fac5bd4128b8cff6f7c1c0e09924c7f038049d
  #path: /local/data/karpuz1/birby/conda/heasoft
  patches:
    - ../heasoft/tcltk_Makefile.patch
    - ../heasoft/perl_config_heacore.patch
    - ../heasoft/perl_config_tcltk_pgperl.patch
    - ../heasoft/python_makefiles_heacore.patch
    - if: osx
      then:
      - ../heasoft/pgplot_makemake_osx.patch
    - ../heasoft/fix-x11-conda.patch

build:
  number: 0

requirements:
  host:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - pkg-config
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-xorgproto
    - xorg-libxcursor
    - fftw
    - gsl
    - if: osx or (linux and not aarch64)
      then:
        - fgsl
    - perl
    - pip
    - setuptools
    - numpy
    - scipy
    - astropy-base
    - matplotlib
    - if: linux and not aarch64
      then:
        - kernel-headers_linux-64 = 3.10.0
    - if: linux and aarch64
      then:
        - kernel-headers_linux-aarch64 = 4.18.0
    # readline
    # cfitsio
    # ape
    # heainit
    # heaio
    # heautils
    # wcslib
    # mpfit
    # attitude (atfunctions, aber, coord, coordfits, ephemeris, rew)
    # tcltk (pgplot)
  run:
    - libcurl
    - zlib
    - libbrotlidec
    - libiconv
    - libpng
    - xorg-libx11
    - xorg-libxt
    - xorg-libxcursor
    - xorg-xorgproto
    - fftw
    - gsl
    - if: osx or (linux and not aarch64)
      then:
        - fgsl
    - perl
    - numpy
    - scipy
    - astropy-base
    - matplotlib
    - if: (linux and not aarch64) or (osx and not arm64)
      then:
        - lynx
    # readline
    # cfitsio
    # ape
    # heainit
    # heaio
    # heautils
    # wcslib
    # mpfit
    # attitude (atfunctions, aber, coord, coordfits, ephemeris, rew)
    # tcltk (pgplot)
    # cfitsio-perl
    # tcltk (pgplot-perl)
    # wcstools
    - heagen
    - heatools
    - xspec
    - caltools
    - fimage
    - futils
    - heasarc
    - qdp
    - time
    - ximage
    - xronos
    - xselect

about:
  homepage: https://heasarc.gsfc.nasa.gov/docs/software/lheasoft/
  #license_file: LICENSE
  summary: the core library of heasoft
  description: |
    xspec.
  documentation: https://heasarc.gsfc.nasa.gov/docs/software/lheasoft/
