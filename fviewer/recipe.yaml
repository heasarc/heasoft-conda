context:
  name: "fviewer"
  version: "0.4.4"         # Replace with your package version

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 15fb86dd1148bfac5f5a2d8d055e0834acc344fed492288f0130b14c88e702f1

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling 
  run:
    - python >=3.10
    - fastapi >=0.100.0
    - requests >=2.33.1
    - uvicorn >=0.23.0
    - websockets >=11.0
    - python-multipart >= 0.0.5

tests:
  - python:
      imports:
        - fviewer
      pip_check: true

about:
  homepage: https://github.com/heasarc/fviewer
  license: BSD-3-Clause-Clear
  summary: "modern, browser-based astronomical FITS file viewer"
